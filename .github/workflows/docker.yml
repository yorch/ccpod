name: Docker

on:
  push:
    branches:
      - main
  # Manual recovery: re-push the versioned tags for an existing release.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3) to tag the image with"
        required: false
        default: ""
        type: string
  # Called by release.yml after a release is published (a GITHUB_TOKEN-created
  # tag would not trigger a `tags:` push event).
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3) to tag the image with"
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release tags
        id: release-tags
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          base="${VERSION%%-*}"
          echo "major_minor=${base%.*}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.version || 'unused' }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ steps.release-tags.outputs.major_minor || 'unused' }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
