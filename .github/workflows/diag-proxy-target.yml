name: Diagnose proxy request-target handling

# Throwaway diagnostic: reproduces the Release-workflow unit failure on Linux
# and prints what the HTTP server actually saw as the request target.

on: pull_request

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Print toolchain
        run: bun --version
      - name: Instrument the proxy handler
        run: |
          python3 -c "
          import pathlib
          path = pathlib.Path('src/auth/proxy.ts')
          text = path.read_text()
          anchor = \"    const requestTarget = req.url ?? '/'\"
          probe = anchor + '\n' + '    console.error(\"[diag] \" + JSON.stringify({ url: req.url, method: req.method, host: req.headers.host }))'
          assert anchor in text, 'anchor not found'
          path.write_text(text.replace(anchor, probe, 1))
          print('instrumented')
          "
      - name: Run the full isolated suite (unit + integration)
        run: bun test --isolate > /tmp/full.log 2>&1 || true
      - name: Run the unit-only suite for comparison
        run: bun test tests/unit --isolate > /tmp/unit.log 2>&1 || true
      - name: Report
        run: |
          echo "===== FULL: diag lines ====="
          grep -o '\[diag\].*' /tmp/full.log | sort | uniq -c || true
          echo "===== FULL: summary ====="
          grep -E 'tests failed|^ [0-9]+ (pass|fail)' /tmp/full.log | tail -5 || true
          echo "===== FULL: failures ====="
          grep -E '^\(fail\)' /tmp/full.log | head -10 || true
          echo "===== UNIT: diag lines ====="
          grep -o '\[diag\].*' /tmp/unit.log | sort | uniq -c || true
          echo "===== UNIT: summary ====="
          grep -E 'tests failed|^ [0-9]+ (pass|fail)' /tmp/unit.log | tail -5 || true
